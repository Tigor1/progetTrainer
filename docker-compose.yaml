version: "3.9"

services:
  app:
    build: .
    container_name: 'proger_trainer'
    ports:
      - "8084:8080"
    depends_on:
      - db
    environment:
      POSTGRES_URL: "jdbc:postgresql://db:5432/proger_trainer"
      POSTGRES_USERNAME: "developer"
      POSTGRES_PASSWORD: "developer"
    networks:
      - backend

  db:
    image: 'postgres:13.1-alpine'
    container_name: db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=developer
      - POSTGRES_PASSWORD=developer
      - POSTGRES_DB=proger_trainer
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U developer -d proger_trainer" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE_DOCKER://kafka:9092,OUTSIDE_DOCKER://localhost:29092
      KAFKA_LISTENERS: INSIDE_DOCKER://0.0.0.0:9092,OUTSIDE_DOCKER://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE_DOCKER:PLAINTEXT,OUTSIDE_DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE_DOCKER
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper
    working_dir: /opt/kafka

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - 8086:8080
    depends_on:
      - zookeeper
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

